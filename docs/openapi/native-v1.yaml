components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Odissey native access token
  parameters:
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string }
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { type: string }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: string }
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema: { type: string, enum: [movies, tv, music] }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    ProviderId:
      name: providerId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string }
    GrantId:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    GrantToken:
      name: grantToken
      in: path
      required: true
      description: |
        Short-lived bearer credential. Never persist or include this path
        value in access logs, traces, analytics, or diagnostics.
      schema:
        type: string
        minLength: 64
        maxLength: 64
        writeOnly: true
    TranscodeId:
      name: transcodeId
      in: path
      required: true
      schema: { type: string }
  responses:
    MediaPage:
      description: Cursor-paginated media.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/MediaCollection'
              - type: object
                required: [page]
                properties:
                  page: { $ref: '#/components/schemas/CursorPage' }
    ChannelPage:
      description: Cursor-paginated channels.
      content:
        application/json:
          schema:
            type: object
            required: [data, page]
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/Channel' }
              page: { $ref: '#/components/schemas/CursorPage' }
    Unauthorized:
      description: Missing, invalid, expired, or replayed credentials.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The current user lacks permission.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found or not visible to this user.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Playback or state conflict.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Validation:
      description: Invalid request.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }
    RateLimited:
      description: Request rate limit exceeded.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Queued:
      description: Background operation queued.
      content:
        application/json:
          schema:
            type: object
            required: [queued, auditId]
            properties:
              queued: { type: boolean }
              auditId: { $ref: '#/components/schemas/AuditId' }
    ProblemResponse:
      description: Request failed with a structured problem response.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        code: { type: string }
        requestId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9._:-]+$'
    Server:
      type: object
      required:
        [product, serverId, serverVersion, setupRequired, api, features, serverTime]
      properties:
        product: { type: string, const: Odissey }
        serverId: { type: string }
        serverVersion: { type: string }
        setupRequired: { type: boolean }
        api:
          type: object
          required: [minimumVersion, maximumVersion, baseUrl]
          properties:
            minimumVersion: { type: string }
            maximumVersion: { type: string }
            baseUrl: { type: string, format: uri }
        features:
          type: array
          uniqueItems: true
          items: { type: string }
        serverTime: { type: string, format: date-time }
    DeviceRegistration:
      type: object
      additionalProperties: false
      required: [installationId, deviceName, platform, appVersion]
      properties:
        installationId:
          type: string
          minLength: 16
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
        deviceName: { type: string, maxLength: 100 }
        platform: { type: string, const: tvOS }
        appVersion: { type: string, maxLength: 32 }
        osVersion: { type: [string, 'null'], maxLength: 32 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, device]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, maxLength: 255 }
        device: { $ref: '#/components/schemas/DeviceRegistration' }
    SetupRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, passwordConfirmation, device]
      properties:
        setupToken:
          type: [string, 'null']
          maxLength: 255
          description: User-entered one-time deployment setup token.
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 12, maxLength: 255 }
        passwordConfirmation:
          type: string
          minLength: 12
          maxLength: 255
        device: { $ref: '#/components/schemas/DeviceRegistration' }
    TokenResponse:
      type: object
      required:
        [sessionId, accessToken, refreshToken, tokenType, expiresIn,
         accessExpiresAt, refreshExpiresAt, user, profiles, activeProfile]
      properties:
        sessionId: { type: string }
        accessToken: { type: string, writeOnly: true }
        refreshToken: { type: string, writeOnly: true }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, minimum: 0 }
        accessExpiresAt: { type: string, format: date-time }
        refreshExpiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
        profiles:
          type: array
          items: { $ref: '#/components/schemas/User' }
        activeProfile:
          type: string
          description: ID of the active object in the profiles array.
    DeviceSession:
      type: object
      required: [id, deviceName, platform, appVersion, createdAt, current]
      properties:
        id: { type: string }
        deviceName: { type: string }
        platform: { type: string }
        appVersion: { type: string }
        osVersion: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        current: { type: boolean }
    User:
      type: object
      required: [id, name, email, timezone, isAdmin]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        timezone: { type: string }
        isAdmin: { type: boolean }
        active:
          type: boolean
          description: Present for profile-list and authentication payloads.
        preferences: { $ref: '#/components/schemas/Preferences' }
    UserEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }
    Preferences:
      type: object
      additionalProperties: false
      required: [timezone, autoplay, preferredQuality]
      properties:
        timezone: { type: string }
        autoplay: { type: boolean }
        preferredQuality:
          type: string
          enum: [auto, original, 1080p, 720p]
    Library:
      type: object
      required: [id, name, kind, itemCount]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [movies, tv, music] }
        itemCount: { type: integer, minimum: 0 }
    MediaSourceSummary:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [local, s3, webdav, iptv] }
    MediaItem:
      type: object
      required:
        [id, title, kind, mediaKind, favorite, technical, artwork, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        kind: { type: string, enum: [movie, series, episode, track] }
        mediaKind: { type: string, enum: [video, music] }
        durationMs: { type: [integer, 'null'], minimum: 0 }
        favorite: { type: boolean }
        progress:
          $ref: '#/components/schemas/Progress'
        summary:
          type: object
          properties:
            overview: { type: string }
            year: { type: integer }
            rating: { type: number }
            genres: { type: array, items: { type: string } }
            seriesTitle: { type: string }
            seasonNumber: { type: integer }
            episodeNumber: { type: integer }
            artist: { type: string }
            album: { type: string }
            trackNumber: { type: integer }
        technical:
          type: object
          properties:
            container: { type: [string, 'null'] }
            mimeType: { type: [string, 'null'] }
            videoCodec: { type: [string, 'null'] }
            audioCodec: { type: [string, 'null'] }
            requiresTranscode: { type: boolean }
            sizeBytes: { type: [integer, 'null'], minimum: 0 }
        source: { $ref: '#/components/schemas/MediaSourceSummary' }
        artwork:
          type: object
          properties:
            poster: { type: string, format: uri }
            backdrop: { type: string, format: uri }
        updatedAt: { type: [string, 'null'], format: date-time }
    MediaCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MediaItem' }
    MediaSection:
      type: object
      required: [id, title, items]
      properties:
        id: { type: string }
        title: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/MediaItem' }
    CursorPage:
      type: object
      required: [perPage]
      properties:
        perPage: { type: integer, minimum: 1, maximum: 100 }
        nextCursor: { type: [string, 'null'] }
        previousCursor: { type: [string, 'null'] }
    Progress:
      type: [object, 'null']
      required: [positionMs, completed, sequence]
      properties:
        positionMs: { type: integer, minimum: 0 }
        durationMs: { type: [integer, 'null'], minimum: 1 }
        completed: { type: boolean }
        sequence: { type: integer, minimum: 0 }
        updatedAt: { type: [string, 'null'], format: date-time }
    ProgressUpdate:
      type: object
      additionalProperties: false
      required: [sequence, positionMs]
      properties:
        sequence: { type: integer, minimum: 1, maximum: 2147483647 }
        positionMs: { type: integer, minimum: 0, maximum: 604800000 }
        durationMs:
          type: [integer, 'null']
          minimum: 1
          maximum: 604800000
        completed: { type: boolean }
    ProgressResult:
      type: object
      required: [accepted, sequence, positionMs, completed]
      properties:
        accepted: { type: boolean }
        sequence: { type: integer }
        positionMs: { type: integer }
        completed: { type: boolean }
    FavoriteState:
      type: object
      required: [favorite]
      properties:
        favorite: { type: boolean }
    Track:
      type: object
      required: [id, codec, language, label]
      properties:
        id: { type: string }
        codec: { type: string }
        language: { type: string }
        label: { type: string }
        channels: { type: [integer, 'null'] }
    SubtitleTrack:
      allOf:
        - $ref: '#/components/schemas/Track'
        - type: object
          required: [format, url]
          properties:
            format: { type: string, enum: [webvtt, imsc1] }
            url: { type: string, format: uri }
            hearingImpaired: { type: boolean }
    Season:
      type: object
      required: [id, seriesId, number, episodeCount]
      properties:
        id: { type: string }
        seriesId: { type: string }
        number: { type: integer, minimum: 0 }
        episodeCount: { type: integer, minimum: 0 }
    Channel:
      type: object
      required: [id, name, favorite, iconUrl]
      properties:
        id: { type: string }
        name: { type: string }
        channelNumber: { type: [string, 'null'] }
        group:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        favorite: { type: boolean }
        iconUrl: { type: string, format: uri }
        programs:
          type: array
          items: { $ref: '#/components/schemas/EpgProgram' }
    EpgProgram:
      type: object
      required: [id, channelId, title, startsAt, endsAt]
      properties:
        id: { type: string }
        channelId: { type: string }
        title: { type: string }
        description: { type: [string, 'null'] }
        category: { type: [string, 'null'] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    Guide:
      type: object
      required: [window, channels, page]
      properties:
        window:
          type: object
          required: [startsAt, endsAt, timezone]
          properties:
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
            timezone: { type: string }
        channels:
          type: array
          items: { $ref: '#/components/schemas/Channel' }
        page: { $ref: '#/components/schemas/CursorPage' }
    PlaybackDevice:
      type: object
      additionalProperties: false
      required:
        [platform, osVersion, modelFamily, maximumWidth, maximumHeight,
         maximumFrameRate, dynamicRanges, videoCodecs, audioCodecs,
         subtitleFormats]
      properties:
        platform: { type: string, const: tvOS }
        osVersion: { type: string, maxLength: 32 }
        modelFamily: { type: string, const: AppleTV4K }
        maximumWidth: { type: integer, minimum: 640, maximum: 7680 }
        maximumHeight: { type: integer, minimum: 360, maximum: 4320 }
        maximumFrameRate: { type: integer, minimum: 24, maximum: 120 }
        dynamicRanges:
          type: array
          maxItems: 8
          items:
            type: string
            enum: [sdr, hdr10, hdr10Plus, hlg, dolbyVision]
        videoCodecs:
          type: array
          maxItems: 8
          items: { type: string, enum: [h264, hevc, av1] }
        audioCodecs:
          type: array
          maxItems: 16
          items:
            type: string
            enum: [aac, ac3, eac3, alac, flac, mp3, opus]
        subtitleFormats:
          type: array
          maxItems: 8
          items: { type: string, enum: [webvtt, imsc1] }
    PlaybackResolveRequest:
      type: object
      additionalProperties: false
      required: [mediaId, device]
      properties:
        mediaId: { type: string }
        intent: { type: string, enum: [play, resume], default: play }
        positionMs: { type: integer, minimum: 0, maximum: 604800000 }
        audioTrackId:
          type: [string, 'null']
          pattern: '^(embedded:)?([0-9]|[12][0-9]|3[01])$'
          description: |
            Requests a server-selected audio rendition. Selection forces HLS
            remuxing or audio-only transcoding; it is never ignored on direct
            playback.
        subtitleTrackId:
          type: [string, 'null']
          pattern: '^(embedded:([0-9]|[12][0-9]|3[01])|caption:[0-9A-HJKMNP-TV-Z]{26})$'
          description: |
            Default subtitle rendition. The returned HLS master also exposes
            the other available WebVTT renditions for native media selection.
        device: { $ref: '#/components/schemas/PlaybackDevice' }
        preferences:
          type: object
          additionalProperties: false
          properties:
            maximumBitrate:
              type: [integer, 'null']
              minimum: 64000
              maximum: 200000000
            preferOriginalQuality: { type: boolean }
            allowTranscode: { type: boolean }
    PlaybackResolution:
      type: object
      required:
        [sessionId, mode, decisionReason, status, url, expiresAt, container,
         heartbeatIntervalSeconds]
      properties:
        sessionId: { type: string }
        mode:
          type: string
          enum: [direct, remux, audioTranscode, fullTranscode]
        decisionReason: { type: string }
        status: { type: string, enum: [pending, processing, ready, failed] }
        url:
          type: string
          format: uri
          description: |
            Short-lived bearer URL. Never persist or include this path in
            access logs, traces, analytics, or diagnostics.
        statusUrl: { type: [string, 'null'], format: uri }
        expiresAt:
          type: string
          format: date-time
          description: Current rolling playback-grant expiry.
        container: { type: string }
        channelId: { type: string }
        video: { type: object }
        audio: { type: object }
        availableAudioTracks:
          type: array
          items: { $ref: '#/components/schemas/Track' }
        availableSubtitleTracks:
          type: array
          items: { $ref: '#/components/schemas/SubtitleTrack' }
        selectedAudioTrackId: { type: [string, 'null'] }
        selectedSubtitleTrackId: { type: [string, 'null'] }
        heartbeatIntervalSeconds: { type: integer, minimum: 5 }
    TranscodeStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, processing, ready, failed] }
        errorCode: { type: [string, 'null'] }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
    DataCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { type: object }
    DataObject:
      type: object
      required: [data, auditId]
      properties:
        data: { type: object }
        auditId: { $ref: '#/components/schemas/AuditId' }
    AuditResult:
      type: object
      required: [auditId]
      properties:
        auditId: { $ref: '#/components/schemas/AuditId' }
    AuditId:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    MusicArtist:
      type: object
      required: [id, name, trackCount, artworkUrl]
      properties:
        id: { type: string }
        name: { type: string }
        trackCount: { type: integer, minimum: 0 }
        artworkUrl: { type: string, format: uri }
    MusicAlbum:
      type: object
      required: [id, name, artist, trackCount, artworkUrl]
      properties:
        id: { type: string }
        name: { type: string }
        artist: { type: string }
        trackCount: { type: integer, minimum: 0 }
        artworkUrl: { type: string, format: uri }
        year: { type: [integer, 'null'] }
        favorite: { type: boolean }
    MusicArtistPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MusicArtist' }
        page: { $ref: '#/components/schemas/CursorPage' }
    MusicAlbumPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MusicAlbum' }
        page: { $ref: '#/components/schemas/CursorPage' }
    MusicPlaylistSummary:
      type: object
      additionalProperties: false
      required: [id, name, trackCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
        name: { type: string, minLength: 1, maxLength: 100 }
        trackCount: { type: integer, minimum: 0, maximum: 1000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MusicPlaylistItem:
      type: object
      additionalProperties: false
      required: [position, track]
      properties:
        position: { type: integer, minimum: 0, maximum: 4999 }
        track: { $ref: '#/components/schemas/MediaItem' }
    MusicPlaylist:
      type: object
      additionalProperties: false
      required:
        [id, name, trackCount, createdAt, updatedAt, items, itemsPage]
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
        name: { type: string, minLength: 1, maxLength: 100 }
        trackCount: { type: integer, minimum: 0, maximum: 1000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MusicPlaylistItem' }
        itemsPage: { $ref: '#/components/schemas/CursorPage' }
    MusicPlaylistPage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MusicPlaylistSummary' }
        page: { $ref: '#/components/schemas/CursorPage' }
    MusicPlaylistResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/MusicPlaylist' }
    MusicPlaylistWrite:
      type: object
      additionalProperties: false
      required: [name, trackIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        trackIds:
          type: array
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
    DeletedResult:
      type: object
      required: [deleted, auditId]
      properties:
        deleted: { type: boolean, const: true }
        auditId: { $ref: '#/components/schemas/AuditId' }
    AdminUserCreate:
      type: object
      additionalProperties: false
      required: [name, email, password, passwordConfirmation]
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 12, maxLength: 255 }
        passwordConfirmation:
          type: string
          minLength: 12
          maxLength: 255
        isAdmin: { type: boolean }
    AdminUserUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        isAdmin: { type: boolean }
    IptvProviderWrite:
      type: object
      additionalProperties: false
      required: [name, providerType]
      properties:
        name: { type: string, maxLength: 255 }
        providerType: { type: string, enum: [xtream, m3u] }
        baseUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
        playlistUrl:
          type: [string, 'null']
          format: uri
          maxLength: 4096
        xmltvUrl:
          type: [string, 'null']
          format: uri
          maxLength: 4096
        maxConnections:
          type: [integer, 'null']
          minimum: 1
          maximum: 100
        username:
          type: [string, 'null']
          maxLength: 1024
          writeOnly: true
        password:
          type: [string, 'null']
          maxLength: 1024
          writeOnly: true
        allowInsecureHttp: { type: boolean }
        enabled: { type: boolean }
    MediaSourceWrite:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name: { type: string, maxLength: 100 }
        type: { type: string, enum: [local, s3, webdav] }
        path: { type: [string, 'null'], maxLength: 2048, writeOnly: true }
        url:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          writeOnly: true
        endpoint:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          writeOnly: true
        bucket: { type: [string, 'null'], maxLength: 255, writeOnly: true }
        prefix: { type: [string, 'null'], maxLength: 1024, writeOnly: true }
        region: { type: [string, 'null'], maxLength: 64, writeOnly: true }
        accessKey: { type: [string, 'null'], maxLength: 512, writeOnly: true }
        secretKey: { type: [string, 'null'], maxLength: 512, writeOnly: true }
        username: { type: [string, 'null'], maxLength: 512, writeOnly: true }
        password: { type: [string, 'null'], maxLength: 512, writeOnly: true }
        allowPrivateNetwork: { type: boolean }
        enabled: { type: boolean }
    IntegrationWrite:
      type: object
      additionalProperties: false
      required: [captionLanguages]
      properties:
        tmdbApiToken:
          type: [string, 'null']
          maxLength: 4096
          writeOnly: true
        subdlApiKey:
          type: [string, 'null']
          maxLength: 4096
          writeOnly: true
        openSubtitlesApiKey:
          type: [string, 'null']
          maxLength: 4096
          writeOnly: true
        captionLanguages:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, pattern: '^[a-zA-Z]{2,3}$' }
        clear:
          type: array
          maxItems: 3
          items:
            type: string
            enum: [tmdbApiToken, subdlApiKey, openSubtitlesApiKey]
