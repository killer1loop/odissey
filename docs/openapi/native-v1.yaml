openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Odissey Native Client API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Canonical API contract for native Odissey clients. JSON fields use
    camelCase, identifiers are opaque strings, times are UTC ISO 8601, and
    durations and playback positions are integer milliseconds.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Discovery
    description: Public server identity, compatibility, and feature discovery.
  - name: Authentication
    description: First launch, login, rotating device sessions, and profiles.
  - name: Catalog
    description: User-scoped libraries, media details, search, state, and captions.
  - name: Music
    description: Music browsing and persistent user-owned playlists.
  - name: Live TV
    description: Channel groups, guide data, favorites, and live playback setup.
  - name: Playback
    description: Native media resolution, short-lived grants, and session control.
  - name: Administration
    description: Administrator-only users, sources, providers, jobs, and integrations.
paths:
  /server:
    get:
      tags: [Discovery]
      summary: Get server
      operationId: getServer
      security: []
      responses:
        '200':
          description: Server identity and API compatibility.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /setup/admin:
    post:
      tags: [Authentication]
      summary: Create initial admin
      operationId: createInitialAdmin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '201':
          description: Initial administrator and native session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Device-scoped tokens and the authenticated user.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Rotated access and refresh token pair plus active profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout
      operationId: logout
      responses:
        '200':
          description: Current device session revoked.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: boolean, const: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions:
    get:
      tags: [Authentication]
      summary: List device sessions
      operationId: listDeviceSessions
      responses:
        '200':
          description: Active device sessions for the current user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/DeviceSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions/{sessionId}:
    delete:
      tags: [Authentication]
      summary: Revoke device session
      operationId: revokeDeviceSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Selected device session revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean }
        '404':
          $ref: '#/components/responses/NotFound'
  /me:
    get:
      tags: [Authentication]
      summary: Get current user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user/profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/preferences:
    put:
      tags: [Authentication]
      summary: Update preferences
      operationId: updatePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
      responses:
        '200':
          description: Updated current user/profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '422':
          $ref: '#/components/responses/Validation'
  /profiles:
    get:
      tags: [Authentication]
      summary: List profiles
      operationId: listProfiles
      responses:
        '200':
          description: Profiles available to the native session.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /profiles/{profileId}/activate:
    post:
      tags: [Authentication]
      summary: Activate profile
      operationId: activateProfile
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Activated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /home:
    get:
      tags: [Catalog]
      summary: Get home
      operationId: getHome
      responses:
        '200':
          description: Home shelves including continue watching and favorites.
          content:
            application/json:
              schema:
                type: object
                required: [sections]
                properties:
                  sections:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaSection'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /libraries:
    get:
      tags: [Catalog]
      summary: List libraries
      operationId: listLibraries
      responses:
        '200':
          description: Virtual libraries and configured media sources.
          content:
            application/json:
              schema:
                type: object
                required: [data, sources]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Library'
                  sources:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaSourceSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /libraries/{libraryId}/items:
    get:
      tags: [Catalog]
      summary: List library items
      operationId: listLibraryItems
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: sourceId
          in: query
          schema: { type: string, maxLength: 26 }
        - name: favorite
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          description: Server-global deterministic ordering for cursor paging.
          schema:
            type: string
            default: title
            enum: [recently_added, title, release_date]
      responses:
        '200':
          $ref: '#/components/responses/MediaPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /media/{mediaId}:
    get:
      tags: [Catalog]
      summary: Get media
      operationId: getMedia
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Media details.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MediaItem' }
        '404':
          $ref: '#/components/responses/NotFound'
  /media/{mediaId}/artwork/{kind}:
    get:
      tags: [Catalog]
      summary: Get media artwork
      operationId: getMediaArtwork
      parameters:
        - $ref: '#/components/parameters/MediaId'
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [poster, backdrop] }
        - name: width
          in: query
          description: |
            Optional aspect-fit width. Artwork is never upscaled and the
            resulting long edge is rounded down to one of the cache buckets
            32, 64, 96, 128, 160, 240, 320, 480, 720, 1080, 1920, or 3840.
          schema:
            type: integer
            minimum: 32
            maximum: 3840
        - name: height
          in: query
          description: |
            Optional aspect-fit height. When width is also supplied, the
            requested box may contain at most 8294400 pixels.
          schema:
            type: integer
            minimum: 32
            maximum: 3840
      responses:
        '200':
          description: Original artwork or a cached bounded JPEG variant.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, max-age=86400
            ETag:
              schema: { type: string }
            Last-Modified:
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, contentEncoding: binary }
        '304':
          description: Cached artwork is still current.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
  /media/{mediaId}/tracks:
    get:
      tags: [Catalog]
      summary: Get media tracks
      operationId: getMediaTracks
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Probed audio and embedded subtitle tracks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  audio:
                    type: array
                    items: { $ref: '#/components/schemas/Track' }
                  subtitles:
                    type: array
                    items: { $ref: '#/components/schemas/Track' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /media/{mediaId}/captions:
    get:
      tags: [Catalog]
      summary: Get media captions
      operationId: getMediaCaptions
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Downloaded caption tracks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SubtitleTrack' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /media/{mediaId}/captions/{subtitleId}.vtt:
    get:
      tags: [Catalog]
      summary: Get media caption file
      operationId: getMediaCaptionFile
      parameters:
        - $ref: '#/components/parameters/MediaId'
        - name: subtitleId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: User-authorized WebVTT caption file.
          content:
            text/vtt:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
  /series/{seriesId}/seasons:
    get:
      tags: [Catalog]
      summary: List seasons
      operationId: listSeasons
      parameters:
        - name: seriesId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Seasons for an imported series.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Season'
        '404':
          $ref: '#/components/responses/NotFound'
  /seasons/{seasonId}/episodes:
    get:
      tags: [Catalog]
      summary: List episodes
      operationId: listEpisodes
      parameters:
        - name: seasonId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/MediaPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /search:
    get:
      tags: [Catalog]
      summary: Search
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: kind
          in: query
          schema: { type: string, enum: [movies, tv, music] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/MediaPage'
        '422':
          $ref: '#/components/responses/Validation'
  /favorites:
    get:
      tags: [Catalog]
      summary: List media favorites
      operationId: listMediaFavorites
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/MediaPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /favorites/{kind}/{id}:
    put:
      tags: [Catalog]
      summary: Add favorite
      operationId: addFavorite
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, const: media }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Favorite state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Catalog]
      summary: Remove favorite
      operationId: removeFavorite
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, const: media }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Favorite state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteState'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /history:
    get:
      tags: [Catalog]
      summary: Get history
      operationId: getHistory
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/MediaPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /media/{mediaId}/progress:
    put:
      tags: [Catalog]
      summary: Update progress
      operationId: updateProgress
      parameters:
        - $ref: '#/components/parameters/MediaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressUpdate'
      responses:
        '200':
          description: Accepted monotonic progress state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
  /media/{mediaId}/watched:
    post:
      tags: [Catalog]
      summary: Mark watched
      operationId: markWatched
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Completed progress state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /music/artists:
    get:
      tags: [Music]
      summary: List artists
      operationId: listArtists
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor-paginated imported artists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicArtistPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /music/albums:
    get:
      tags: [Music]
      summary: List albums
      operationId: listAlbums
      parameters:
        - name: artist
          in: query
          schema: { type: string, maxLength: 255 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor-paginated imported albums.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicAlbumPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /music/tracks:
    get:
      tags: [Music]
      summary: List music tracks
      operationId: listMusicTracks
      parameters:
        - name: artist
          in: query
          description: Exact artist name returned by the artist/album summary.
          schema: { type: string, maxLength: 255 }
        - name: album
          in: query
          description: Exact album name returned by the album summary.
          schema: { type: string, maxLength: 255 }
        - name: sourceId
          in: query
          schema: { type: string, maxLength: 26 }
        - name: favorite
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/MediaPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /music/playlists:
    get:
      tags: [Music]
      summary: List music playlists
      operationId: listMusicPlaylists
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Owner-scoped cursor-paginated playlists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicPlaylistPage'
        '422':
          $ref: '#/components/responses/Validation'
    post:
      tags: [Music]
      summary: Create music playlist
      operationId: createMusicPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MusicPlaylistWrite'
      responses:
        '201':
          description: Playlist created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicPlaylistResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
  /music/playlists/{playlistId}:
    get:
      tags: [Music]
      summary: Get music playlist
      operationId: getMusicPlaylist
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Playlist and deterministically ordered tracks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicPlaylistResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Music]
      summary: Update music playlist
      operationId: updateMusicPlaylist
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MusicPlaylistWrite'
      responses:
        '200':
          description: Playlist and its ordered tracks replaced atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicPlaylistResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Music]
      summary: Delete music playlist
      operationId: deleteMusicPlaylist
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  const: delete-playlist
      responses:
        '200':
          description: Playlist deleted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deleted]
                properties:
                  deleted: { type: boolean, const: true }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
  /live/groups:
    get:
      tags: [Live TV]
      summary: List channel groups
      operationId: listChannelGroups
      responses:
        '200':
          description: Active channel groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /live/channels:
    get:
      tags: [Live TV]
      summary: List channels
      operationId: listChannels
      parameters:
        - name: groupId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: favorites
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/ChannelPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /live/channels/{channelId}:
    get:
      tags: [Live TV]
      summary: Get channel
      operationId: getChannel
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Channel plus upcoming schedule.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Channel' }
        '404':
          $ref: '#/components/responses/NotFound'
  /live/channels/{channelId}/icon:
    get:
      tags: [Live TV]
      summary: Get channel icon
      operationId: getChannelIcon
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Validated external channel icon.
          content:
            image/jpeg: { schema: { type: string, contentEncoding: binary } }
            image/png: { schema: { type: string, contentEncoding: binary } }
            image/webp: { schema: { type: string, contentEncoding: binary } }
        '404':
          $ref: '#/components/responses/NotFound'
  /live/guide:
    get:
      tags: [Live TV]
      summary: Get guide
      operationId: getGuide
      parameters:
        - name: startsAt
          in: query
          schema: { type: string, format: date-time }
        - name: endsAt
          in: query
          schema: { type: string, format: date-time }
        - name: groupId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: favorites
          in: query
          schema: { type: boolean }
        - name: timezone
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Normalized guide timeline and paginated channels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guide'
        '422':
          $ref: '#/components/responses/Validation'
  /live/channels/{channelId}/schedule:
    get:
      tags: [Live TV]
      summary: Get channel schedule
      operationId: getChannelSchedule
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - name: startsAt
          in: query
          schema: { type: string, format: date-time }
        - name: endsAt
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
