      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: |
            Playback grant heartbeat accepted. Expiry advances by no more than
            ten minutes and never beyond the client session refresh expiry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: boolean }
                  expiresAt: { type: string, format: date-time }
