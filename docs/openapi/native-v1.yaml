  /playback/resolve:
    post:
      tags: [Playback]
      summary: Resolve media playback
      operationId: resolveMediaPlayback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackResolveRequest'
      responses:
        '200':
          description: |
            Native playback decision and a bearer-grant URL valid for a
            rolling window of at most ten minutes. Re-resolving the same media
            resource from the same native client session revokes its previous
            active grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackResolution'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
  /live/playback/resolve:
    post:
      tags: [Playback, Live TV]
      summary: Resolve live playback
      operationId: resolveLivePlayback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [channelId, device]
              properties:
                channelId: { type: integer, minimum: 1 }
                device:
                  type: object
                  additionalProperties: false
                  required: [platform, osVersion]
                  properties:
                    platform: { type: string, const: tvOS }
                    osVersion: { type: string, maxLength: 32 }
      responses:
        '200':
          description: |
            Authenticated provider HLS gateway grant valid for a rolling
            window of at most ten minutes. Re-resolving the same channel from
            the same native client session revokes its previous active grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackResolution'
        '404':
          $ref: '#/components/responses/NotFound'
  /playback/sessions/{sessionId}/heartbeat:
