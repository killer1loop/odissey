name: odissey

services:
  app:
    image: odissey:local
    build:
      context: .
    restart: unless-stopped
    stop_grace_period: 6m
    ports:
      - "8000:8000"
    environment:
      APP_URL: http://localhost:8000
    volumes:
      - odissey-data:/var/lib/odissey
    tmpfs:
      - /var/cache/odissey/transcodes:uid=33,gid=33,mode=0750,size=4g

volumes:
  odissey-data:
