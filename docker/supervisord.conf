[unix_http_server]
file=/tmp/odissey-supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/odissey-supervisord.pid
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/odissey-supervisor.sock

[program:web]
command=/usr/local/bin/frankenphp run --config /etc/frankenphp/Caddyfile --adapter caddyfile
directory=/app
user=www-data
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=HOME="/tmp"

[program:queue]
command=php artisan queue:work --queue=high,default,iptv-sync --sleep=1 --tries=3 --backoff=5 --timeout=650 --max-time=3600 --no-interaction
directory=/app
user=www-data
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=680
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=HOME="/tmp"

[program:scheduler]
command=php artisan schedule:work --no-interaction
directory=/app
user=www-data
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=HOME="/tmp"
