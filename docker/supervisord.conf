[unix_http_server]
file=/tmp/odissey-supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/odissey-supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/odissey-supervisor.sock

[program:web]
command=/usr/local/bin/frankenphp run --config /etc/frankenphp/Caddyfile --adapter caddyfile
directory=/app
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=HOME="/tmp"

[program:queue]
command=php artisan queue:work --queue=high,default,iptv-sync --sleep=1 --tries=3 --backoff=5 --timeout=650 --max-time=3600 --no-interaction
directory=/app
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=680
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=HOME="/tmp"

[program:queue-transcodes]
command=php -d memory_limit=512M artisan queue:work database-transcodes --queue=transcodes --sleep=1 --tries=1 --backoff=5 --timeout=21630 --max-time=21600 --memory=448 --no-interaction
directory=/app
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=35
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=HOME="/tmp"

[program:queue-iptv-vod]
process_name=%(program_name)s_%(process_num)02d
numprocs=4
command=php -d memory_limit=256M artisan queue:work --queue=iptv-vod --sleep=1 --tries=3 --backoff=5 --timeout=300 --max-time=3600 --memory=192 --no-interaction
directory=/app
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=330
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=HOME="/tmp"

[program:queue-media-discovery]
command=php -d memory_limit=256M artisan queue:work database-media-discovery --queue=media-discovery --sleep=1 --tries=3 --backoff=5 --timeout=3600 --max-time=3600 --memory=192 --no-interaction
directory=/app
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=3630
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=HOME="/tmp"

[program:queue-media-scan]
process_name=%(program_name)s_%(process_num)02d
numprocs=2
command=php -d memory_limit=384M artisan queue:work database-media-scan --queue=media-scan --sleep=1 --tries=2 --backoff=5 --timeout=900 --max-time=3600 --memory=320 --no-interaction
directory=/app
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=930
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=HOME="/tmp"

[program:queue-media-enrichment]
process_name=%(program_name)s_%(process_num)02d
numprocs=2
command=php -d memory_limit=256M artisan queue:work --queue=media-enrichment --sleep=1 --tries=2 --backoff=5 --timeout=240 --max-time=3600 --memory=192 --no-interaction
directory=/app
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=270
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=HOME="/tmp"

[program:scheduler]
